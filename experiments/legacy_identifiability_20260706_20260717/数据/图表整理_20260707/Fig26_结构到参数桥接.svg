<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill:#f8fafc; stroke:#334155; stroke-width:2; rx:12; }
      .main { fill:#e0f2fe; stroke:#0369a1; stroke-width:2; rx:12; }
      .param { fill:#ecfdf5; stroke:#047857; stroke-width:2; rx:12; }
      .out { fill:#fff7ed; stroke:#c2410c; stroke-width:2; rx:12; }
      .txt { font-family:"Microsoft YaHei", "SimSun", Arial, sans-serif; font-size:22px; fill:#0f172a; }
      .small { font-family:"Microsoft YaHei", "SimSun", Arial, sans-serif; font-size:18px; fill:#334155; }
      .arrow { stroke:#334155; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
      .title { font-family:"Microsoft YaHei", "SimSun", Arial, sans-serif; font-size:30px; font-weight:700; fill:#0f172a; }
    </style>
  </defs>

  <text class="title" x="355" y="48">高频变压器结构到等效参数的桥接关系</text>

